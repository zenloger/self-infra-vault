server {
    listen 80;
    listen [::]:80;
    server_name secret.zenlog.pro;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://secret.zenlog.pro$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name secret.zenlog.pro;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/secret.zenlog.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secret.zenlog.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:zenlog_vault_ssl:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64m;
    client_body_timeout 60s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript;

    # Callback query strings contain one-use OAuth codes; don't record URLs.
    access_log off;
    error_log /var/log/nginx/zenlog-vault.error.log crit;

    location / {
        proxy_pass http://127.0.0.1:8137;
        proxy_set_header Host secret.zenlog.pro;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
    }
}
