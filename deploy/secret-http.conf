# Temporary first-deployment challenge host, before the TLS certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name secret.zenlog.pro;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
